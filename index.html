<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Key System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & BASIC STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-attachment: fixed;
            color: #ecf0f1; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* --- LAYOUT CONTAINER --- */
        .content-wrapper {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            flex-grow: 1; 
            padding-left: 20px; 
            padding-right: 20px;
            width: 100%;
        }

        /* --- CENTER COLUMN --- */
        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        /* --- SCROLL INSTRUCTION TEXT --- */
        .scroll-instruction {
            margin-top: 50px; 
            color: #00d2ff; 
            font-family: 'Rajdhani', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            animation: bounce 2s infinite;
            margin-bottom: 25px;
        }

        /* --- DIVIDER TEXT --- */
        .keep-scrolling-text {
            margin-top: 60px;
            margin-bottom: 40px;
            color: #a29bfe;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            border-top: 2px dashed #6c5ce7;
            border-bottom: 2px dashed #6c5ce7;
            padding: 20px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* --- AD CLUSTERS --- */
        .ad-cluster {
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            gap: 20px; 
            width: 100%;
            margin-bottom: 20px;
        }

        .wing-ad {
            width: 160px;
            height: 300px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a2e;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .top-banner-box {
            width: 728px; 
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a2e; 
            border: 1px dashed #444; 
            flex-shrink: 0;
            border-radius: 4px;
        }

        .native-banner-box {
            width: 100%; 
            max-width: 800px;
            min-height: 150px; 
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .twin-rect-cluster {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .rect-ad {
            width: 300px;
            height: 250px;
            background-color: #1a1a2e;
            border: 1px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        /* --- MAIN CARD --- */
        .key-card {
            background: rgba(20, 20, 35, 0.85);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); 
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 100px; 
            margin-bottom: 100px; 
            position: relative;
            overflow: hidden;
        }

        .key-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00d2ff, #2ecc71);
        }

        /* --- STATUS LABEL FOR CHECKPOINTS --- */
        .status-label {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            color: #00d2ff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .key-title {
            color: #fff; 
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .key-desc {
            color: #b2bec3; 
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* --- BUTTONS --- */
        .btn-get-key {
            background: linear-gradient(45deg, #27ae60, #2ecc71); 
            color: #fff; 
            border: none;
            padding: 20px 24px;
            font-size: 1.3rem;
            font-weight: 800;
            font-family: 'Rajdhani', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
            margin-bottom: 20px;
        }

        .btn-get-key:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.6);
            filter: brightness(1.1);
        }

        .btn-verifying {
            background: linear-gradient(45deg, #f39c12, #e67e22) !important; 
            color: #fff !important;
            cursor: wait;
        }

        .btn-success {
            background: linear-gradient(45deg, #2980b9, #3498db) !important; 
            color: #fff !important;
        }

        /* --- DONATION SECTION --- */
        .donation-divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 20px 0;
            width: 100%;
        }

        .donation-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .donation-text {
            font-size: 0.9rem;
            color: #a29bfe;
            margin-bottom: 5px;
        }

        .btn-donate {
            background-color: #003087; /* PayPal Blue */
            color: white;
            border: 1px solid #009cde;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-donate:hover {
            background-color: #0045a0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 48, 135, 0.4);
        }
        
        /* NEW BUTTON STYLE FOR ROBLOX */
        .btn-roblox {
            background: linear-gradient(45deg, #8e44ad, #9b59b6);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
            font-family: 'Poppins', sans-serif;
            margin-top: 5px; /* Slight space below paypal */
        }
        
        .btn-roblox:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.4);
            filter: brightness(1.1);
        }

        .paypal-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* --- SIDEBAR ADS --- */
        .ad-sidebar {
            width: 160px;
            height: auto; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 5vh;
            gap: 100px;
            flex-shrink: 0;
        }

        iframe { border: none; overflow: hidden; }

        @media (max-width: 1450px) {
            .wing-ad { display: none; }
        }

        @media (max-width: 900px) {
            .ad-sidebar { display: none; }
            .top-banner-box { display: none; }
            .native-banner-box { display: none; }
            .twin-rect-cluster { display: none; }
            .content-wrapper { justify-content: center; padding: 1rem; }
            .scroll-instruction { font-size: 1.8rem; }
            .key-card { margin-top: 90vh; }
        }
    </style>
</head>
