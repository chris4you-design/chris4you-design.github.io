<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Key System</title>
    
    <script src="https://directsinew.com/9b/36/30/9b3630da0276d8ba0a15f7a4a87d4af8.js"></script>
    <style>
        /* --- RESET & BASIC STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1014;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none; /* Prevents highlighting text */
        }

        .main-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1; 
            padding: 2rem;
        }

        .key-card {
            background-color: #1b1e23;
            padding: 3rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #2a2d33;
        }

        .key-title {
            color: #f1c40f;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .key-desc {
            color: #aaa;
            margin-bottom: 2.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .btn-get-key {
            background-color: #2ecc71; 
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-get-key:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .btn-verifying {
            background-color: #f1c40f !important;
            color: #000 !important;
            cursor: wait;
            box-shadow: none !important;
            transform: none !important;
        }

        .btn-success {
            background-color: #3498db !important;
            color: #fff !important;
            cursor: pointer;
        }

        .footer-ad-section {
            background-color: #16181c;
            border-top: 2px solid #f1c40f;
            padding: 20px 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-container {
            width: 728px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        iframe { border: none; overflow: hidden; }

        @media (max-width: 750px) {
            .ad-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <div class="main-section">
        <div class="key-card">
            <div class="key-title">
                <span>🔒</span> Macro Key System
            </div>
            <p class="key-desc">
                Click the button below to generate your daily access key.
            </p>
            <button id="actionBtn" class="btn-get-key" onclick="handleClick()">
                GET DAILY KEY
            </button>
        </div>
    </div>

    <footer class="footer-ad-section">
        <div class="ad-container">
            <iframe src="banner-728.html" width="728" height="90" scrolling="no" 
                sandbox="allow-scripts allow-popups allow-forms allow-same-origin">
            </iframe>
        </div>
    </footer>
