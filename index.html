<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Key System</title>
    
    <style>
        /* --- RESET & BASIC STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8; 
            color: #333333; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* --- LAYOUT CONTAINER --- */
        .content-wrapper {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;
            flex-grow: 1; 
            padding-left: 20px; 
            padding-right: 20px;
            width: 100%;
        }

        /* --- CENTER COLUMN --- */
        .center-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        /* --- SCROLL INSTRUCTION TEXT --- */
        .scroll-instruction {
            margin-top: 50px; 
            color: #e67e22; 
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
        }

        /* --- DIVIDER TEXT --- */
        .keep-scrolling-text {
            margin-top: 60px;
            margin-bottom: 40px;
            color: #7f8c8d;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            border-top: 2px dashed #bdc3c7;
            border-bottom: 2px dashed #bdc3c7;
            padding: 20px;
            width: 100%;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* --- AD CLUSTER (Wings + 728) --- */
        .ad-cluster {
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            gap: 20px; 
            width: 100%;
            margin-bottom: 20px;
        }

        .wing-ad {
            width: 160px;
            height: 300px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee;
        }

        .top-banner-box {
            width: 728px; 
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee; 
            border: 1px dashed #ccc; 
            flex-shrink: 0;
        }

        /* --- NATIVE BANNER BOX --- */
        .native-banner-box {
            width: 100%; 
            max-width: 800px;
            min-height: 150px; 
            margin-bottom: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TWIN RECTANGLE CLUSTER --- */
        .twin-rect-cluster {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .rect-ad {
            width: 300px;
            height: 250px;
            background-color: #eee;
            border: 1px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CENTER CARD (Pushed to bottom) --- */
        .key-card {
            background-color: #ffffff; 
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 500px;
            width: 100%;
            border: 1px solid #ddd;
            margin-top: 100px; 
            margin-bottom: 100px; 
        }

        .key-title {
            color: #2c3e50; 
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .key-desc {
            color: #666; 
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .btn-get-key {
            background-color: #27ae60; 
            color: #fff; 
            border: none;
            padding: 18px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: normal;
            word-wrap: break-word;
        }

        .btn-get-key:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-verifying {
            background-color: #f39c12 !important; 
            color: #fff !important;
            cursor: wait;
        }

        .btn-success {
            background-color: #2980b9 !important; 
            color: #fff !important;
            cursor: pointer;
        }

        /* --- SIDEBAR ADS --- */
        .ad-sidebar {
            width: 160px;
            height: auto; 
            /* Grows to fit all 5 stacked banners */
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 5vh;
            gap: 100px; /* Space between the stacked sidebar ads */
            flex-shrink: 0;
        }

        iframe { border: none; overflow: hidden; }

        /* --- RESPONSIVE / MOBILE --- */
        @media (max-width: 1450px) {
            .wing-ad { display: none; }
        }

        @media (max-width: 900px) {
            .ad-sidebar { display: none; }
            .top-banner-box { display: none; }
            .native-banner-box { display: none; }
            .twin-rect-cluster { display: none; }
            .content-wrapper { justify-content: center; padding: 1rem; }
            .scroll-instruction { font-size: 1.5rem; }
            .key-card { margin-top: 90vh; }
        }
    </style>
</head>
